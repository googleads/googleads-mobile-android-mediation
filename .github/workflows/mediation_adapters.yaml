name: Mediation Adapters CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      adapters_to_test: ${{ steps.filter.outputs.adapters_to_test }}
      example: ${{ steps.filter.outputs.example }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Check changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Fetch base branch to compare
            git fetch --no-tags origin "$PR_BASE_REF" --depth=1
            CHANGED_FILES=$(git diff --name-only "origin/$PR_BASE_REF" HEAD)
          elif [[ "$EVENT_NAME" == "push" ]]; then
            # Compare against the pre-push commit on main (falling back to HEAD~1 if all-zeros or unreachable)
            if [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]] && git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"; then
              CHANGED_FILES=$(git diff --name-only "$PUSH_BEFORE" HEAD)
            else
              git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            fi
          else
            CHANGED_FILES=""
          fi
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # 1. Check if Example changed
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || echo "$CHANGED_FILES" | grep -q "^Example/"; then
            echo "example=true" >> $GITHUB_OUTPUT
          else
            echo "example=false" >> $GITHUB_OUTPUT
          fi

          # 2. Discover and filter adapters
          NON_ADAPTERS="adaptertestkit common prerelease"
          # TODO(b/519896882): Remove these directories once they are cleaned up on GitHub.
          DEPRECATED_ADAPTERS="adcolony fyber nend tapjoy vungle"
          ADAPTERS=$(ls -d ThirdPartyAdapters/*/ | sed 's/ThirdPartyAdapters\///' | sed 's/\///')

          # Check for global changes (common utilities, workflow files themselves, or manual dispatch)
          TEST_ALL=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || echo "$CHANGED_FILES" | grep -q -E "^ThirdPartyAdapters/(common|adaptertestkit)/|^\.github/workflows/"; then
            TEST_ALL=true
          fi

          is_non_adapter() {
            local name=$1
            for non_ad in $NON_ADAPTERS $DEPRECATED_ADAPTERS; do
              if [ "$name" = "$non_ad" ]; then
                return 0 # True
              fi
            done
            return 1 # False
          }

          TEST_LIST=()
          for adapter in $ADAPTERS; do
            if ! is_non_adapter "$adapter"; then
              if $TEST_ALL || echo "$CHANGED_FILES" | grep -q "^ThirdPartyAdapters/$adapter/"; then
                TEST_LIST+=("$adapter")
              fi
            fi
          done

          # Convert to JSON array
          if [ ${#TEST_LIST[@]} -eq 0 ]; then
            JSON_ARRAY="[]"
          else
            JSON_ARRAY=$(python3 -c "import json, sys; print(json.dumps(sys.argv[1:]))" "${TEST_LIST[@]}")
          fi
          echo "adapters_to_test=$JSON_ARRAY" >> $GITHUB_OUTPUT
      - name: Block version updates in external PRs
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          !contains(github.event.pull_request.labels.*.name, 'allow-version-bump')
        run: |
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"

          MODIFIED_FILES=$(git diff --name-only --diff-filter=M HEAD^1 HEAD)
          FAILED=0

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            ADDED_LINES=$(git diff -U0 HEAD^1 HEAD -- "$file" | grep -E '^\+[^+]' || true)
            [[ -z "$ADDED_LINES" ]] && continue

            if [[ "$file" =~ ^ThirdPartyAdapters/.+/build\.gradle$ ]]; then
              if echo "$ADDED_LINES" | grep -q -E '^\+[[:space:]]*(stringVersion|versionCode)\b'; then
                echo "::error file=$file::Do not update stringVersion or versionCode in PRs. Adapter versions are bumped automatically during release; add release notes under '#### Next version' in CHANGELOG.md instead."
                FAILED=1
              fi
            elif [[ "$file" =~ ^ThirdPartyAdapters/.+/CHANGELOG\.md$ ]]; then
              if echo "$ADDED_LINES" | grep -q -E '^\+[[:space:]]*####[[:space:]]+\[?[Vv]ersion\b'; then
                echo "::error file=$file::Do not add a '#### Version ...' heading in PRs. Add your release notes under '#### Next version' in CHANGELOG.md instead."
                FAILED=1
              fi
            fi
          done <<< "$MODIFIED_FILES"

          if [[ "$FAILED" -ne 0 ]]; then
            echo "Version updates detected in external PR. Revert version changes and place changelog entries under '#### Next version' (maintainers can add the 'allow-version-bump' label to override)."
            exit 1
          fi

  test-adapters:
    needs: check-paths
    if: ${{ needs.check-paths.outputs.adapters_to_test != '[]' }}
    strategy:
      matrix:
        adapter: ${{ fromJson(needs.check-paths.outputs.adapters_to_test) }}
    name: Test ${{ matrix.adapter }} Adapter
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit Tests
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          cd "ThirdPartyAdapters/$ADAPTER/"
          GRADLE_VERSION=$(sed -E -n 's/.*gradle-(.*)-(bin|all)\.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)
          GRADLE_MAJOR_VERSION="${GRADLE_VERSION%%.*}"
          brew install gradle@$GRADLE_MAJOR_VERSION
          brew link gradle@$GRADLE_MAJOR_VERSION
          gradle wrapper --gradle-version $GRADLE_VERSION
          ./gradlew test --scan

  Build:
    needs: check-paths
    if: ${{ needs.check-paths.outputs.example == 'true' }}
    name: Build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Example
        run: |-
          cd Example/
          GRADLE_VERSION=$(sed -E -n 's/.*gradle-(.*)-(bin|all)\.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)
          GRADLE_MAJOR_VERSION="${GRADLE_VERSION%%.*}"
          brew install gradle@$GRADLE_MAJOR_VERSION
          brew link gradle@$GRADLE_MAJOR_VERSION
          gradle wrapper --gradle-version $GRADLE_VERSION
          ./gradlew build -P includeSnippets=true

  all-checks-passed:
    needs: [check-paths, test-adapters, Build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Status
        env:
          CHECK_PATHS_RESULT: ${{ needs.check-paths.result }}
          BUILD_RESULT: ${{ needs.Build.result }}
          TEST_ADAPTERS_RESULT: ${{ needs.test-adapters.result }}
        run: |
          if [[ "$CHECK_PATHS_RESULT" == "failure" || "$CHECK_PATHS_RESULT" == "cancelled" ]]; then
            echo "check-paths failed or was cancelled."
            exit 1
          fi
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then
            echo "Build failed or was cancelled."
            exit 1
          fi
          if [[ "$TEST_ADAPTERS_RESULT" == "failure" || "$TEST_ADAPTERS_RESULT" == "cancelled" ]]; then
            echo "test-adapters failed or was cancelled."
            exit 1
          fi
          echo "All checks completed successfully or were skipped."
